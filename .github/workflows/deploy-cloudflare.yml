name: Deploy to Cloudflare Pages

# Served at https://projects.tanmoybh.com/archboard-3d/ through the projects hub,
# which proxies /archboard-3d/* to this Pages project.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT_NAME: tanmoybh-archboard-3d

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://projects.tanmoybh.com/archboard-3d/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Test passphrase gate and publish API
        run: node --test gate-tests/middleware.test.mjs gate-tests/api.test.mjs

      - name: Build
        run: npm run build

      - name: Check passphrase secret
        env:
          ARCHBOARD_PASSPHRASE: ${{ secrets.ARCHBOARD_PASSPHRASE }}
        run: |
          if [ -z "$ARCHBOARD_PASSPHRASE" ]; then
            echo "::error::Add the ARCHBOARD_PASSPHRASE repository secret before deploying."
            exit 1
          fi

      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT_NAME }} --production-branch=main

      # Secrets apply to the next deployment, so set it before deploying.
      - name: Set access passphrase
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARCHBOARD_PASSPHRASE: ${{ secrets.ARCHBOARD_PASSPHRASE }}
        run: printf '%s' "$ARCHBOARD_PASSPHRASE" | npx --yes wrangler@4.40.0 pages secret put ACCESS_PASSPHRASE --project-name="$PROJECT_NAME"

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main --commit-dirty=true
